<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${titulo} + ' · DAS Chamados'">DAS Chamados</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<nav th:fragment="navbar(ativo)" class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand fw-semibold" th:href="@{/}">DAS Chamados</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
            aria-controls="menu" aria-expanded="false" aria-label="Alternar menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" th:classappend="${ativo == 'chamados'} ? 'active'" th:href="@{/chamados}">Chamados</a></li>
        <li class="nav-item"><a class="nav-link" th:classappend="${ativo == 'clientes'} ? 'active'" th:href="@{/clientes}">Clientes</a></li>
        <li class="nav-item"><a class="nav-link" th:classappend="${ativo == 'tecnicos'} ? 'active'" th:href="@{/tecnicos}">Técnicos</a></li>
        <li class="nav-item"><a class="nav-link" th:classappend="${ativo == 'categorias'} ? 'active'" th:href="@{/categorias}">Categorias</a></li>
      </ul>
      <a class="btn btn-sm btn-primary" th:href="@{/chamados/novo}">+ Novo chamado</a>
    </div>
  </div>
</nav>

<div th:fragment="mensagens">
  <div class="alert alert-success alert-dismissible fade show" th:if="${sucesso}">
    <span th:text="${sucesso}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
  </div>
  <div class="alert alert-danger alert-dismissible fade show" th:if="${erro}">
    <span th:text="${erro}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
  </div>
</div>

<th:block th:fragment="scripts">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>

</body>
</html>
