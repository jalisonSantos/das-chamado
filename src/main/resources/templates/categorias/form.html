<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Categorias')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('categorias')}"></nav>
<main class="container py-4">
  <h1 class="h3 mb-3" th:text="${id == null} ? 'Nova categoria' : 'Editar categoria'"></h1>
  <form class="card shadow-sm p-4" method="post" th:object="${form}"
        th:action="${id == null} ? @{/categorias} : @{/categorias/{id}(id=${id})}">
    <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}" th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
      <div class="mb-3">
        <label class="form-label" for="nome">Nome *</label>
        <input class="form-control" id="nome" type="text" maxlength="80" th:field="*{nome}" th:errorclass="is-invalid">
        <div class="invalid-feedback" th:errors="*{nome}"></div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="descricao">Descrição</label>
        <input class="form-control" id="descricao" type="text" maxlength="255" th:field="*{descricao}" th:errorclass="is-invalid">
        <div class="invalid-feedback" th:errors="*{descricao}"></div>
      </div>
    <div class="d-flex gap-2">
      <button class="btn btn-primary" type="submit">Salvar</button>
      <a class="btn btn-outline-secondary" th:href="@{/categorias}">Cancelar</a>
    </div>
  </form>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
