<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Chamados')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('chamados')}"></nav>
<main class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0">Chamados</h1>
    <a class="btn btn-primary" th:href="@{/chamados/novo}">+ Novo chamado</a>
  </div>
  <div th:replace="~{fragments/layout :: mensagens}"></div>

  <ul class="nav nav-pills mb-3">
    <li class="nav-item"><a class="nav-link" th:classappend="${filtro == null} ? 'active'" th:href="@{/chamados}">Todos</a></li>
    <li class="nav-item" th:each="s : ${statusList}">
      <a class="nav-link" th:classappend="${filtro == s} ? 'active'" th:href="@{/chamados(status=${s})}" th:text="${s.rotulo}"></a>
    </li>
  </ul>

  <div class="card shadow-sm">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead>
          <tr><th>#</th><th>Título</th><th>Cliente</th><th>Categoria</th><th>Técnico</th><th>Prioridade</th><th>Status</th><th>Aberto em</th><th class="text-end">Ações</th></tr>
        </thead>
        <tbody>
          <tr th:each="c : ${itens}">
            <td th:text="${c.id}"></td>
            <td><a class="text-decoration-none fw-semibold" th:href="@{/chamados/{id}(id=${c.id})}" th:text="${c.titulo}"></a></td>
            <td th:text="${c.clienteNome}"></td>
            <td th:text="${c.categoriaNome}"></td>
            <td th:text="${c.tecnicoNome != null} ? ${c.tecnicoNome} : '—'"></td>
            <td><span class="badge" th:classappend="'text-bg-' + ${c.prioridade.cor}" th:text="${c.prioridade.rotulo}"></span></td>
            <td><span class="badge" th:classappend="'text-bg-' + ${c.status.cor}" th:text="${c.status.rotulo}"></span></td>
            <td class="text-nowrap" th:text="${#temporals.format(c.dataAbertura, 'dd/MM/yyyy HH:mm')}"></td>
            <td class="text-end text-nowrap">
              <a class="btn btn-sm btn-outline-secondary" th:href="@{/chamados/{id}/editar(id=${c.id})}">Editar</a>
              <form class="d-inline" method="post" th:action="@{/chamados/{id}/excluir(id=${c.id})}"
                    onsubmit="return confirm('Excluir este chamado e seus comentários?')">
                <button class="btn btn-sm btn-outline-danger" type="submit">Excluir</button>
              </form>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(itens)}">
            <td colspan="9" class="text-center text-muted py-4">Nenhum chamado encontrado.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
