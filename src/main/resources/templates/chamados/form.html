<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Chamado')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('chamados')}"></nav>
<main class="container py-4">
  <h1 class="h3 mb-3" th:text="${id == null} ? 'Novo chamado' : 'Editar chamado #' + ${id}"></h1>

  <form class="card shadow-sm p-4" method="post" th:object="${form}"
        th:action="${id == null} ? @{/chamados} : @{/chamados/{id}(id=${id})}">

    <div class="mb-3">
      <label class="form-label" for="titulo">Título *</label>
      <input class="form-control" id="titulo" type="text" maxlength="150" th:field="*{titulo}" th:errorclass="is-invalid">
      <div class="invalid-feedback" th:errors="*{titulo}"></div>
    </div>

    <div class="mb-3">
      <label class="form-label" for="descricao">Descrição *</label>
      <textarea class="form-control" id="descricao" rows="5" maxlength="2000" th:field="*{descricao}" th:errorclass="is-invalid"></textarea>
      <div class="invalid-feedback" th:errors="*{descricao}"></div>
    </div>

    <div class="row">
      <div class="col-md-4 mb-3">
        <label class="form-label" for="clienteId">Cliente *</label>
        <select class="form-select" id="clienteId" th:field="*{clienteId}" th:errorclass="is-invalid">
          <option value="">Selecione...</option>
          <option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nome}"></option>
        </select>
        <div class="invalid-feedback" th:errors="*{clienteId}"></div>
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label" for="categoriaId">Categoria *</label>
        <select class="form-select" id="categoriaId" th:field="*{categoriaId}" th:errorclass="is-invalid">
          <option value="">Selecione...</option>
          <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nome}"></option>
        </select>
        <div class="invalid-feedback" th:errors="*{categoriaId}"></div>
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label" for="tecnicoId">Técnico</label>
        <select class="form-select" id="tecnicoId" th:field="*{tecnicoId}">
          <option value="">Sem técnico</option>
          <option th:each="t : ${tecnicos}" th:value="${t.id}" th:text="${t.nome}"></option>
        </select>
      </div>
    </div>

    <div class="row">
      <div class="col-md-4 mb-3">
        <label class="form-label" for="prioridade">Prioridade *</label>
        <select class="form-select" id="prioridade" th:field="*{prioridade}" th:errorclass="is-invalid">
          <option th:each="p : ${prioridades}" th:value="${p}" th:text="${p.rotulo}"></option>
        </select>
        <div class="invalid-feedback" th:errors="*{prioridade}"></div>
      </div>
      <div class="col-md-4 mb-3" th:if="${id != null}">
        <label class="form-label" for="status">Status *</label>
        <select class="form-select" id="status" th:field="*{status}" th:errorclass="is-invalid">
          <option th:each="s : ${statusList}" th:value="${s}" th:text="${s.rotulo}"></option>
        </select>
        <div class="invalid-feedback" th:errors="*{status}"></div>
      </div>
    </div>

    <div class="d-flex gap-2">
      <button class="btn btn-primary" type="submit">Salvar</button>
      <a class="btn btn-outline-secondary" th:href="${id == null} ? @{/chamados} : @{/chamados/{id}(id=${id})}">Cancelar</a>
    </div>
  </form>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
